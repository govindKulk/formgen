<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#background)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="60" fill="url(#accent1)" opacity="0.3"/>
  <circle cx="1100" cy="530" r="80" fill="url(#accent2)" opacity="0.3"/>
  <rect x="950" y="50" width="200" height="200" rx="20" fill="url(#accent3)" opacity="0.2" transform="rotate(15 950 50)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1" opacity="0.3"/>
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Main content container -->
  <rect x="80" y="120" width="1040" height="390" rx="24" fill="white" stroke="#e5e7eb" stroke-width="2" opacity="0.95"/>
  
  <!-- Logo and brand section -->
  <g transform="translate(120, 180)">
    <!-- Logo -->
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#logoGradient)"/>
    <rect x="12" y="12" width="36" height="8" rx="4" fill="white"/>
    <rect x="12" y="26" width="24" height="8" rx="4" fill="white"/>
    <rect x="12" y="40" width="30" height="8" rx="4" fill="white"/>
    
    <!-- Brand text -->
    <text x="80" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1f2937">formGen</text>
    <text x="80" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#6b7280">Create multi-step forms with clicks</text>
  </g>
  
  <!-- Feature highlights -->
  <g transform="translate(120, 280)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#374151">✨ Drag & Drop Builder</text>
    <text x="0" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#374151">📊 Real-time Analytics</text>
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#374151">🎨 Custom Branding</text>
    
    <text x="280" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#374151">📱 Mobile Optimized</text>
    <text x="280" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#374151">🔒 Secure & Private</text>
    <text x="280" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#374151">⚡ Lightning Fast</text>
  </g>
  
  <!-- Mock form preview -->
  <g transform="translate(650, 180)">
    <rect x="0" y="0" width="400" height="280" rx="16" fill="white" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="50" rx="16" fill="url(#logoGradient)" opacity="0.1"/>
    
    <!-- Form elements -->
    <rect x="30" y="80" width="120" height="8" rx="4" fill="#9ca3af"/>
    <rect x="30" y="100" width="340" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    
    <rect x="30" y="150" width="100" height="8" rx="4" fill="#9ca3af"/>
    <rect x="30" y="170" width="340" height="32" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    
    <rect x="30" y="220" width="120" height="32" rx="6" fill="url(#logoGradient)"/>
    <text x="90" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Submit</text>
  </g>
  
  <!-- CTA -->
  <g transform="translate(600, 550)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#6b7280" text-anchor="middle">Build beautiful forms in minutes, not hours</text>
  </g>
</svg>